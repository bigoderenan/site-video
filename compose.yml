name: labrbigode_site_video

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: labrbigode/site-video:1.0.0
    container_name: labrbigode_site-video
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_BASE_PATH: ""
      FILE_TTL_MINUTES: 10
    volumes:
      - outputs:/app/outputs
      - work:/app/work
    networks:
      lab:
        aliases:
          - site-video
    shm_size: 2gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  lab:
    external: true
    name: labrbigode

volumes:
  outputs:
    name: labrbigode_site_video_outputs
    labels:
      lb.stack: labrbigode
      lb.managed: "true"
  work:
    name: labrbigode_site_video_work
    labels:
      lb.stack: labrbigode
      lb.managed: "true"
